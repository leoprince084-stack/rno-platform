<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar como Empresa - RNO</title>

    <style>
       
* {
    box-sizing: border-box;
}

:root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #10223d;
    --azul: #2878f0;
    --azul-claro: #66b0ff;
    --texto: #f1f6ff;
    --secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

html {
    min-height: 100%;
    background: var(--fundo);
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(ellipse at top, #15345b 0%, var(--fundo) 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: var(--texto);
}

.container {
    width: 100%;
    max-width: 450px;
}

.logo {
    text-align: center;
    color: var(--texto);
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #ffffff, var(--azul-claro));
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.logo p {
    margin-top: 8px;
    font-size: 15px;
    color: var(--secundario);
}

.card {
    background: linear-gradient(145deg, #122945, #0d1d33);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}

.card h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
    color: var(--texto);
    font-size: 24px;
}

.subtitulo {
    text-align: center;
    color: var(--secundario);
    margin-bottom: 28px;
    line-height: 1.6;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
    color: var(--texto);
}

input {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    background: #09182b;
    color: var(--texto);
    border: 1px solid var(--borda);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
    color: #8296b2;
}

input:focus {
    border-color: var(--azul-claro);
    box-shadow: 0 0 0 3px rgba(40, 120, 240, 0.15);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--azul), #1760d5);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(40, 120, 240, 0.2);
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(40, 120, 240, 0.3);
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

#mensagem {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    border: 1px solid var(--borda);
    background: rgba(4, 15, 30, 0.5);
    color: var(--texto);
}

.links {
    text-align: center;
    margin-top: 22px;
    line-height: 1.9;
}

.links a {
    color: var(--azul-claro);
    text-decoration: none;
    font-weight: bold;
}

.links a:hover {
    color: white;
    text-decoration: underline;
}

.voltar {
    margin-top: 15px;
    text-align: center;
}

.voltar a {
    color: var(--secundario);
    text-decoration: none;
    font-size: 14px;
}

.voltar a:hover {
    color: white;
}

@media (max-width: 480px) {
    .card {
        padding: 26px 20px;
        border-radius: 16px;
    }

    .logo h1 {
        font-size: 33px;
    }

    .card h2 {
        font-size: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>RNO</h1>
        <p>Rede Nacional de Oportunidades</p>
    </div>

    <div class="card">

        <h2>Entrar como Empresa</h2>

        <p class="subtitulo">
            Aceda à sua conta empresarial
        </p>

        <form id="formLoginEmpresa">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite o e-mail da empresa"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite a sua senha"
                required
            >

            <button
                type="submit"
                id="botao"
            >
                ENTRAR
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="links">

            <div>
                Ainda não tem uma conta?
                <a href="cadastro-empresa.html">
                    Criar conta da empresa
                </a>
            </div>

        </div>

        <div class="voltar">
            <a href="index.html">
                ← Voltar para a página inicial
            </a>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";


const formulario =
    document.getElementById("formLoginEmpresa");

const mensagem =
    document.getElementById("mensagem");

const botao =
    document.getElementById("botao");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
            .value
            .trim();

        const senha =
            document.getElementById("senha")
            .value;


        mensagem.style.display = "block";

        mensagem.innerHTML =
            "A entrar na conta...";

        botao.disabled = true;

        botao.textContent =
            "A ENTRAR...";


        try {

            const resposta =
                await fetch(
                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY
                        },

                        body:
                            JSON.stringify({
                                email: email,
                                password: senha
                            })
                    }
                );


            const resultado =
                await resposta.json();


            console.log(
                "Resposta do Supabase:",
                resultado
            );


            if (!resposta.ok) {

                mensagem.innerHTML =
                    "<strong>Não foi possível entrar.</strong><br><br>" +
                    (
                        resultado.error_description ||
                        resultado.msg ||
                        resultado.message ||
                        "E-mail ou senha incorretos."
                    );

                botao.disabled = false;

                botao.textContent =
                    "ENTRAR";

                return;
            }


            /*
             * Guardar os dados da sessão
             */

            localStorage.setItem(
                "rno_access_token",
                resultado.access_token
            );

            localStorage.setItem(
                "rno_refresh_token",
                resultado.refresh_token || ""
            );

            localStorage.setItem(
                "rno_user_id",
                resultado.user.id
            );

            localStorage.setItem(
                "rno_tipo_conta",
                "empresa"
            );


            mensagem.innerHTML =
                "<strong>✅ LOGIN REALIZADO COM SUCESSO!</strong><br><br>" +
                "A entrar no painel da empresa...";


            setTimeout(
                function() {

                    window.location.href =
                        "dashboard-empresa.html";

                },
                1000
            );


        } catch (erro) {

            console.error(
                "Erro de ligação:",
                erro
            );

            mensagem.innerHTML =
                "<strong>Erro de ligação.</strong><br><br>" +
                erro.message;

            botao.disabled = false;

            botao.textContent =
                "ENTRAR";
        }

    }
);

</script>

</body>
</html>
