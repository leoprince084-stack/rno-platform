
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova palavra-passe | RNO</title>

    <style>
       :root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #10223d;
    --azul: #2878f0;
    --azul-claro: #66b0ff;
    --texto: #f1f6ff;
    --secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(ellipse at top left, #163d70 0%, transparent 48%),
        linear-gradient(135deg, #071426, #0b1d35 55%, #10294a);
    color: var(--texto);
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.caixa {
    background: linear-gradient(
        145deg,
        rgba(18, 41, 69, 0.98),
        rgba(13, 29, 51, 0.98)
    );
    width: 100%;
    max-width: 440px;
    padding: 34px;
    border: 1px solid var(--borda);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    animation: entrada 0.55s ease both;
}

h1 {
    color: var(--texto);
    text-align: center;
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 22px;
}

input,
button {
    width: 100%;
    padding: 14px 15px;
    margin-top: 14px;
    border-radius: 11px;
    font-size: 16px;
    font-family: inherit;
}

input {
    color: var(--texto);
    background: #09182b;
    border: 1px solid var(--borda);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
    color: #8195b1;
}

input:focus {
    border-color: var(--azul-claro);
    box-shadow: 0 0 0 3px rgba(40, 120, 240, 0.16);
}

button {
    border: none;
    background: linear-gradient(135deg, var(--azul), #1760d0);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(40, 120, 240, 0.22);
    transition: transform 0.2s, filter 0.2s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

button:active:not(:disabled) {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#mensagem {
    color: var(--secundario);
    line-height: 1.6;
    overflow-wrap: anywhere;
    margin-top: 16px;
    font-size: 14px;
}

a {
    color: var(--azul-claro);
    text-decoration: none;
    transition: color 0.2s;
}

a:hover {
    color: white;
    text-decoration: underline;
}

.voltar {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .caixa {
        padding: 25px 20px;
        border-radius: 18px;
    }

    h1 {
        font-size: 24px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
    </style>
</head>

<body>
    <main class="caixa">
        <h1>RNO</h1>
        <h2>Definir nova palavra-passe</h2>

        <p>Introduz a tua nova palavra-passe e confirma-a.</p>

        <form id="formNovaSenha">
            <label for="senha">Nova palavra-passe</label>
            <input
                type="password"
                id="senha"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Mínimo de 6 caracteres"
            >

            <label for="confirmarSenha">Confirmar palavra-passe</label>
            <input
                type="password"
                id="confirmarSenha"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Repete a nova palavra-passe"
            >

            <button type="submit" id="botaoGuardar">
                Guardar nova palavra-passe
            </button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <div class="voltar">
            <a href="login.html">Voltar para o login</a>
        </div>
    </main>

    <script>
        const SUPABASE_URL =
            "https://bwkpmirlwrsbeiavzapm.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

        const form = document.getElementById("formNovaSenha");
        const senha = document.getElementById("senha");
        const confirmarSenha = document.getElementById("confirmarSenha");
        const botao = document.getElementById("botaoGuardar");
        const mensagem = document.getElementById("mensagem");

        function obterTokenRecuperacao() {
            const hash = window.location.hash.substring(1);
            const parametros = new URLSearchParams(hash);

            return {
                accessToken: parametros.get("access_token"),
                tipo: parametros.get("type"),
                erro: parametros.get("error_description")
            };
        }

        const recuperacao = obterTokenRecuperacao();

        if (recuperacao.erro) {
            mensagem.textContent =
                "A ligação de recuperação expirou ou não é válida. Solicita uma nova ligação.";
            mensagem.style.color = "#b42318";
            form.style.display = "none";
        } else if (
            !recuperacao.accessToken ||
            recuperacao.tipo !== "recovery"
        ) {
            mensagem.textContent =
                "Abre esta página através da ligação recebida no email de recuperação.";
            mensagem.style.color = "#b42318";
            form.style.display = "none";
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (senha.value.length < 6) {
                mensagem.textContent =
                    "A palavra-passe deve ter pelo menos 6 caracteres.";
                mensagem.style.color = "#b42318";
                return;
            }

            if (senha.value !== confirmarSenha.value) {
                mensagem.textContent =
                    "As palavras-passe não coincidem.";
                mensagem.style.color = "#b42318";
                return;
            }

            if (!recuperacao.accessToken ||
                recuperacao.tipo !== "recovery") {
                mensagem.textContent =
                    "A ligação não é válida. Solicita uma nova recuperação.";
                mensagem.style.color = "#b42318";
                return;
            }

            botao.disabled = true;
            botao.textContent = "A guardar...";
            mensagem.textContent = "";

            try {
                const resposta = await fetch(
                    SUPABASE_URL + "/auth/v1/user",
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                "Bearer " + recuperacao.accessToken
                        },
                        body: JSON.stringify({
                            password: senha.value
                        })
                    }
                );

                const resultado =
                    await resposta.json().catch(() => ({}));

                if (!resposta.ok) {
                    throw new Error(
                        resultado.msg ||
                        resultado.message ||
                        resultado.error_description ||
                        "Não foi possível alterar a palavra-passe."
                    );
                }

                mensagem.textContent =
                    "Palavra-passe alterada com sucesso! Já podes entrar com a nova palavra-passe.";
                mensagem.style.color = "#176b37";
                form.style.display = "none";

            } catch (erro) {
                console.error("Erro ao alterar palavra-passe:", erro);

                mensagem.textContent =
                    "Não foi possível alterar a palavra-passe. A ligação pode ter expirado. Solicita outra ligação e tenta novamente.";
                mensagem.style.color = "#b42318";

            } finally {
                botao.disabled = false;
                botao.textContent = "Guardar nova palavra-passe";
            }
        });
    </script>
</body>
</html>
