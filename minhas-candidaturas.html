<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Candidaturas | RNO</title>

    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

:root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #10223d;
    --azul: #2878f0;
    --azul-claro: #66b0ff;
    --texto: #f1f6ff;
    --secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

html {
    min-height: 100%;
    background: var(--fundo);
}

body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #15345b 0%, var(--fundo) 65%);
    color: var(--texto);
    line-height: 1.6;
}

header {
    background: rgba(7, 20, 38, 0.88);
    color: var(--texto);
    padding: 22px 20px;
    border-bottom: 1px solid var(--borda);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
}

.topo {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    color: white;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 19px;
    box-shadow: 0 5px 18px rgba(40, 120, 240, 0.3);
}

.topo h1 {
    font-size: 22px;
    margin-bottom: 4px;
}

.topo p {
    font-size: 14px;
    color: var(--secundario);
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.voltar {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 25px;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--painel);
    color: var(--azul-claro);
    text-decoration: none;
    font-weight: bold;
    border: 1px solid var(--borda);
    transition: 0.2s;
}

.voltar:hover {
    background: #19375c;
    transform: translateX(-2px);
}

.titulo-area {
    margin-bottom: 28px;
}

.titulo-area h2 {
    color: var(--texto);
    font-size: 28px;
    margin-bottom: 8px;
}

.titulo-area p {
    color: var(--secundario);
    font-size: 15px;
    line-height: 1.7;
}

#listaCandidaturas {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.candidatura {
    background: linear-gradient(145deg, #122945, #0d1d33);
    border-radius: 18px;
    padding: 26px;
    border: 1px solid var(--borda);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
    transition: transform 0.25s ease, border-color 0.25s ease;
}

.candidatura:hover {
    transform: translateY(-3px);
    border-color: rgba(102, 176, 255, 0.5);
}

.cabecalho-candidatura {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--borda);
}

.vaga {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.icone-vaga {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 15px;
    background: rgba(40, 120, 240, 0.17);
    border: 1px solid rgba(102, 176, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.vaga h3 {
    color: var(--azul-claro);
    font-size: 20px;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.vaga p {
    color: var(--secundario);
    font-size: 13px;
}

.estado {
    display: inline-flex;
    align-items: center;
    padding: 9px 14px;
    border-radius: 30px;
    background: rgba(245, 190, 60, 0.12);
    color: #ffd778;
    border: 1px solid rgba(245, 190, 60, 0.3);
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.informacoes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
    padding-top: 20px;
}

.informacao {
    min-width: 0;
    background: rgba(4, 15, 30, 0.4);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--borda);
}

.informacao strong {
    display: block;
    color: var(--secundario);
    font-size: 11px;
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.informacao span {
    color: var(--texto);
    font-size: 14px;
    font-weight: 500;
    overflow-wrap: anywhere;
}

.carregando,
.vazio {
    background: var(--painel);
    padding: 45px 25px;
    border-radius: 18px;
    text-align: center;
    color: var(--secundario);
    border: 1px solid var(--borda);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
}

.vazio h2 {
    color: var(--azul-claro);
    margin-bottom: 10px;
}

.vazio p {
    color: var(--secundario);
}

.erro {
    background: #301b2b;
    padding: 35px 25px;
    border-radius: 18px;
    text-align: center;
    color: #ffb4bd;
    border: 1px solid rgba(255, 100, 130, 0.3);
}

footer {
    text-align: center;
    padding: 35px 20px;
    color: var(--secundario);
    font-size: 13px;
    border-top: 1px solid var(--borda);
}

@media (max-width: 700px) {
    header {
        padding: 18px 15px;
    }

    .topo h1 {
        font-size: 18px;
    }

    .topo p {
        font-size: 12px;
    }

    .logo {
        width: 44px;
        height: 44px;
        font-size: 17px;
    }

    .container {
        margin: 25px auto;
        padding: 0 14px;
    }

    .titulo-area h2 {
        font-size: 23px;
    }

    .cabecalho-candidatura {
        flex-direction: column;
    }

    .estado {
        align-self: flex-start;
        white-space: normal;
    }

    .informacoes {
        grid-template-columns: 1fr;
    }

    .candidatura {
        padding: 20px;
    }
}

@media (max-width: 450px) {
    .vaga h3 {
        font-size: 18px;
    }

    .icone-vaga {
        width: 46px;
        height: 46px;
    }

    .voltar {
        font-size: 13px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

    </style>

</head>

<body>

<header>

    <div class="topo">

        <div class="logo">
            RNO
        </div>

        <div>
            <h1>Minhas Candidaturas</h1>
            <p>Rede Nacional de Oportunidades</p>
        </div>

    </div>

</header>


<div class="container">

    <a href="dashboard-candidato.html" class="voltar">
        ← Voltar ao meu painel
    </a>


    <div class="titulo-area">

        <h2>📄 As minhas candidaturas</h2>

        <p>
            Consulte as oportunidades às quais se candidatou
            e acompanhe o estado de cada candidatura.
        </p>

    </div>


    <div id="listaCandidaturas" class="carregando">
        A carregar as suas candidaturas...
    </div>

</div>


<footer>

    © 2026 RNO — Rede Nacional de Oportunidades

</footer>


<script src="auth.js"></script>


<script>

// ========================================
// CARREGAR CANDIDATURAS
// ========================================

async function carregarCandidaturas() {

    const container =
        document.getElementById("listaCandidaturas");

    const candidatoId =
        localStorage.getItem("rno_user_id");

    let accessToken =
        localStorage.getItem("rno_access_token");


    // ========================================
    // VERIFICAR LOGIN
    // ========================================

    if (!candidatoId || !accessToken) {

        container.className = "erro";

        container.innerHTML =
            "❌ É necessário iniciar sessão para consultar as suas candidaturas.";

        return;
    }


    // ========================================
    // CONSULTAR CANDIDATURAS
    // ========================================

    async function consultarCandidaturas(token) {

        return await fetch(

            SUPABASE_URL +
            "/rest/v1/candidaturas" +
            "?select=id,nome_completo,email,vaga,candidato_id,status,created_at",

            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + token,

                    "Accept-Profile":
                        "public"
                }
            }
        );
    }


    try {

        // PRIMEIRA TENTATIVA

        let resposta =
            await consultarCandidaturas(accessToken);


        // ========================================
        // RENOVAR TOKEN SE EXPIRADO
        // ========================================

        if (resposta.status === 401) {

            console.log(
                "Token expirado. Tentando renovar sessão..."
            );

            const sessaoRenovada =
                await renovarSessao();

            if (!sessaoRenovada) {

                container.className = "erro";

                container.innerHTML =
                    "❌ A sua sessão expirou. Por favor, faça login novamente.";

                return;
            }

            accessToken =
                localStorage.getItem("rno_access_token");

            resposta =
                await consultarCandidaturas(accessToken);
        }


        // ========================================
        // LER RESPOSTA
        // ========================================

        const texto =
            await resposta.text();

        console.log(
            "RESPOSTA SUPABASE:",
            texto
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro " +
                resposta.status +
                ": " +
                texto
            );
        }


        const dados =
            JSON.parse(texto);


        console.log(
            "MINHAS CANDIDATURAS:",
            dados
        );


        // ========================================
        // NENHUMA CANDIDATURA
        // ========================================

        if (!dados || dados.length === 0) {

            container.className = "vazio";

            container.innerHTML = `

                <h2>📄 Nenhuma candidatura encontrada</h2>

                <p>
                    Ainda não existe nenhuma candidatura
                    associada à sua conta.
                </p>

            `;

            return;
        }


        // ========================================
        // MOSTRAR CANDIDATURAS
        // ========================================

        container.className = "";

        container.innerHTML = dados.map(

            candidatura => {

                let dataFormatada =
                    "Data não disponível";

                if (candidatura.created_at) {

                    const data =
                        new Date(candidatura.created_at);

                    dataFormatada =
                        data.toLocaleDateString(
                            "pt-PT",
                            {
                                day: "2-digit",
                                month: "2-digit",
                                year: "numeric"
                            }
                        );
                }


                return `

                    <div class="candidatura">

                        <div class="cabecalho-candidatura">

                            <div class="vaga">

                                <div class="icone-vaga">
                                    💼
                                </div>

                                <div>

                                    <h3>
                                        ${candidatura.vaga || "Vaga não identificada"}
                                    </h3>

                                    <p>
                                        Candidatura registada na RNO
                                    </p>

                                </div>

                            </div>


                            <span class="estado">
                                🟡 ${candidatura.status || "Em análise"}
                            </span>

                        </div>


                        <div class="informacoes">

                            <div class="informacao">

                                <strong>
                                    Candidato
                                </strong>

                                <span>
                                    ${candidatura.nome_completo || "Não informado"}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>
                                    E-mail
                                </strong>

                                <span>
                                    ${candidatura.email || "Não informado"}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>
                                    Data da candidatura
                                </strong>

                                <span>
                                    ${dataFormatada}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>
                                    Estado
                                </strong>

                                <span>
                                    ${candidatura.status || "Em análise"}
                                </span>

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");


    } catch (erro) {

        console.error(
            "ERRO AO CARREGAR CANDIDATURAS:",
            erro
        );

        container.className = "erro";

        container.innerHTML =
            "❌ Não foi possível carregar as suas candidaturas.<br><br>" +
            "<small>" +
            erro.message +
            "</small>";
    }
}


// ========================================
// INICIAR
// ========================================

carregarCandidaturas();

</script>

</body>
</html>
