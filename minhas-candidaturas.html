<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Candidaturas | RNO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            background: linear-gradient(135deg, #0b3d91, #0b5ed7);
            color: white;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .topo {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: white;
            color: #0b3d91;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 19px;
        }

        .topo h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .topo p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 22px;
            text-decoration: none;
            color: #0b5ed7;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        /* =========================
           TÍTULO
        ========================= */

        .titulo-area {
            margin-bottom: 25px;
        }

        .titulo-area h2 {
            color: #0f172a;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .titulo-area p {
            color: #64748b;
            font-size: 15px;
        }

        /* =========================
           CARTÃO DE CANDIDATURA
        ========================= */

        .candidatura {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        .candidatura:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 22px rgba(15, 23, 42, 0.10);
        }

        .cabecalho-candidatura {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .vaga {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icone-vaga {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #eef5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .vaga h3 {
            color: #0b3d91;
            font-size: 19px;
            margin-bottom: 5px;
        }

        .vaga p {
            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           ESTADO
        ========================= */

        .estado {
            display: inline-block;
            padding: 8px 13px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* =========================
           INFORMAÇÕES
        ========================= */

        .informacoes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding-top: 18px;
            border-top: 1px solid #eef0f3;
        }

        .informacao {
            background: #f8fafc;
            padding: 13px;
            border-radius: 9px;
        }

        .informacao strong {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .informacao span {
            color: #1f2937;
            font-size: 14px;
        }

        /* =========================
           CARREGANDO / VAZIO / ERRO
        ========================= */

        .carregando,
        .vazio,
        .erro {
            background: white;
            padding: 45px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5e7eb;
        }

        .carregando {
            color: #64748b;
        }

        .vazio h2 {
            color: #0b3d91;
            margin-bottom: 10px;
        }

        .vazio p {
            color: #64748b;
        }

        .erro {
            color: #b00020;
        }

        /* =========================
           RODAPÉ
        ========================= */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .container {
                padding: 0 14px;
                margin-top: 22px;
            }

            .topo h1 {
                font-size: 18px;
            }

            .cabecalho-candidatura {
                flex-direction: column;
                align-items: flex-start;
            }

            .informacoes {
                grid-template-columns: 1fr;
            }

            .candidatura {
                padding: 20px;
            }
        }

        @media (max-width: 450px) {

            .logo {
                width: 42px;
                height: 42px;
                font-size: 17px;
            }

            .topo p {
                font-size: 12px;
            }

            .titulo-area h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="topo">

        <div class="logo">
            RNO
        </div>

        <div>
            <h1>Minhas Candidaturas</h1>
            <p>Rede Nacional de Oportunidades</p>
        </div>

    </div>

</header>

<div class="container">

    <a href="dashboard-candidato.html" class="voltar">
        ← Voltar ao meu painel
    </a>

    <div class="titulo-area">

        <h2>📄 As minhas candidaturas</h2>

        <p>
            Consulte as oportunidades às quais se candidatou
            e acompanhe o estado de cada candidatura.
        </p>

    </div>

    <div id="listaCandidaturas" class="carregando">
        A carregar as suas candidaturas...
    </div>

</div>

<footer>
    © 2026 RNO — Rede Nacional de Oportunidades
</footer>

<script src="auth.js"></script>

<script>

// ========================================
// CARREGAR CANDIDATURAS
// ========================================

async function carregarCandidaturas() {

    const container =
        document.getElementById("listaCandidaturas");

    const candidatoId =
        localStorage.getItem("rno_user_id");

    let accessToken =
        localStorage.getItem("rno_access_token");


    // ========================================
    // VERIFICAR LOGIN
    // ========================================

    if (!candidatoId || !accessToken) {

        container.className = "erro";

        container.innerHTML =
            "❌ É necessário iniciar sessão para consultar as suas candidaturas.";

        return;
    }


    // ========================================
    // CONSULTAR CANDIDATURAS
    // ========================================

    async function consultarCandidaturas(token) {

        return await fetch(

            SUPABASE_URL +
            "/rest/v1/candidaturas" +
            "?select=id,nome_completo,email,vaga,candidato_id,status,created_at",

            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + token,

                    "Accept-Profile":
                        "public"
                }
            }
        );
    }


    try {

        // PRIMEIRA TENTATIVA

        let resposta =
            await consultarCandidaturas(accessToken);


        // ========================================
        // RENOVAR TOKEN SE EXPIRADO
        // ========================================

        if (resposta.status === 401) {

            console.log(
                "Token expirado. Tentando renovar sessão..."
            );

            const sessaoRenovada =
                await renovarSessao();

            if (!sessaoRenovada) {

                container.className = "erro";

                container.innerHTML =
                    "❌ A sua sessão expirou. Por favor, faça login novamente.";

                return;
            }

            accessToken =
                localStorage.getItem("rno_access_token");

            resposta =
                await consultarCandidaturas(accessToken);
        }


        // ========================================
        // LER RESPOSTA
        // ========================================

        const texto =
            await resposta.text();

        console.log(
            "RESPOSTA SUPABASE:",
            texto
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro " +
                resposta.status +
                ": " +
                texto
            );
        }


        const dados =
            JSON.parse(texto);


        console.log(
            "MINHAS CANDIDATURAS:",
            dados
        );


        // ========================================
        // NENHUMA CANDIDATURA
        // ========================================

        if (!dados || dados.length === 0) {

            container.className = "vazio";

            container.innerHTML = `

                <h2>📄 Nenhuma candidatura encontrada</h2>

                <p>
                    Ainda não existe nenhuma candidatura
                    associada à sua conta.
                </p>

            `;

            return;
        }


        // ========================================
        // MOSTRAR CANDIDATURAS
        // ========================================

        container.className = "";

        container.innerHTML = dados.map(

            candidatura => {

                let dataFormatada =
                    "Data não disponível";

                if (candidatura.created_at) {

                    const data =
                        new Date(candidatura.created_at);

                    dataFormatada =
                        data.toLocaleDateString(
                            "pt-PT",
                            {
                                day: "2-digit",
                                month: "2-digit",
                                year: "numeric"
                            }
                        );
                }


                return `

                    <div class="candidatura">

                        <div class="cabecalho-candidatura">

                            <div class="vaga">

                                <div class="icone-vaga">
                                    💼
                                </div>

                                <div>

                                    <h3>
                                        ${candidatura.vaga || "Vaga não identificada"}
                                    </h3>

                                    <p>
                                        Candidatura registada na RNO
                                    </p>

                                </div>

                            </div>

                            <span class="estado">
                                🟡 ${candidatura.status || "Em análise"}
                            </span>

                        </div>


                        <div class="informacoes">

                            <div class="informacao">

                                <strong>Candidato</strong>

                                <span>
                                    ${candidatura.nome_completo || "Não informado"}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>E-mail</strong>

                                <span>
                                    ${candidatura.email || "Não informado"}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>Data da candidatura</strong>

                                <span>
                                    ${dataFormatada}
                                </span>

                            </div>


                            <div class="informacao">

                                <strong>Estado</strong>

                                <span>
                                    ${candidatura.status || "Em análise"}
                                </span>

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");


    } catch (erro) {

        console.error(
            "ERRO AO CARREGAR CANDIDATURAS:",
            erro
        );

        container.className = "erro";

        container.innerHTML =
            "❌ Não foi possível carregar as suas candidaturas.<br><br>" +
            "<small>" +
            erro.message +
            "</small>";
    }
}


// ========================================
// INICIAR
// ========================================

carregarCandidaturas();

</script>

</body>
</html>
