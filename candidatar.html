<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        .vaga {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin: 20px 0 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #eef4ff;
            line-height: 1.5;
            word-break: break-word;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Enviar Candidatura</h1>

    <div class="vaga" id="vaga">
        Vaga selecionada
    </div>

    <form id="formCandidatura">

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" required>

        <label for="email">Email</label>
        <input type="email" id="email">
<label for="mensagemCandidato">Mensagem</label>

<textarea
    id="mensagemCandidato"
    name="mensagem"
    placeholder="Faça uma breve apresentação"
    required
></textarea>

        <button type="submit" id="botao">
            Enviar Candidatura
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="vagas.html" class="voltar">
        ← Voltar para Oportunidades
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

const parametros =
    new URLSearchParams(window.location.search);

const vagaSelecionada =
    parametros.get("vaga") || "Vaga não identificada";

document.getElementById("vaga").textContent =
    vagaSelecionada;

const formulario =
    document.getElementById("formCandidatura");

const mensagem =
    document.getElementById("mensagem");

const botao =
    document.getElementById("botao");

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    mensagem.style.display = "block";
    mensagem.innerHTML = "A enviar candidatura...";

    botao.disabled = true;
    botao.textContent = "A enviar...";

    const dados = {
        vaga: vagaSelecionada,
        nome_completo:
            document.getElementById("nome").value.trim(),
        telefone:
            document.getElementById("telefone").value.trim(),
        email:
            document.getElementById("email").value.trim() || null,
        mensagem:
            document.getElementById("mensagemCandidato").value.trim()
    };

    try {

        const resposta = await fetch(
            SUPABASE_URL + "/rest/v1/candidatura",
            {
                method: "POST",

               headers: {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY,
    "Content-Profile": "public",
    "Prefer": "return=representation"
},

                body: JSON.stringify(dados)
            }
        );

        const resultado = await resposta.text();

        if (!resposta.ok) {

            mensagem.innerHTML =
                "<strong>❌ ERRO DO SUPABASE</strong><br><br>" +
                resultado;

            botao.disabled = false;
            botao.textContent = "Enviar Candidatura";

            return;
        }

        mensagem.innerHTML =
            "<strong>✅ CANDIDATURA GRAVADA!</strong><br><br>" +
            "Vaga: " + vagaSelecionada + "<br>" +
            "Nome: " + dados.nome_completo + "<br>" +
            "Mensagem: " + dados.mensagem;

        botao.disabled = false;
        botao.textContent = "Enviar Candidatura";

        console.log("Candidatura gravada:", resultado);

    } catch (erro) {

        mensagem.innerHTML =
            "<strong>❌ ERRO DE LIGAÇÃO</strong><br><br>" +
            erro.message;

        botao.disabled = false;
        botao.textContent = "Enviar Candidatura";
    }

});

</script>

</body>
</html>
