<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato - RNO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Candidato</h1>

    <p class="subtitulo">
        Crie o seu perfil profissional na RNO
    </p>

    <form onsubmit="cadastrarCandidato(event)">

        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>Telefone</label>
        <input type="tel" id="telefone" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label>Área profissional</label>
        <input type="text" id="area" placeholder="Ex.: Contabilidade, Informática..." required>

        <label>Experiência profissional</label>
        <textarea id="experiencia"></textarea>

        <button type="submit">Criar Perfil</button>

    </form>

    <a href="index.html" class="voltar">← Voltar para a RNO</a>

</div>

<script>
    function cadastrarCandidato(event) {
        event.preventDefault();

        alert("Perfil de candidato criado com sucesso!");
    }
</script>

</body>
</html>
