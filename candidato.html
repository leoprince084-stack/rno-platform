<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato - RNO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #0b5ed7;
            color: white;
            border: 0;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        #mensagem {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Candidato</h1>

    <form id="formCandidato">

        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>Telefone</label>
        <input type="tel" id="telefone" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label>Área profissional</label>
        <input type="text" id="area" required>

        <label>Experiência profissional</label>
        <textarea id="experiencia"></textarea>

        <button type="submit">Criar Perfil</button>

    </form>

    <div id="mensagem"></div>

    <a href="index.html" class="voltar">← Voltar para a RNO</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const URL_SUPABASE = "https://bwkpmirlwrsbeiavzapm.supabase.co";

const CHAVE_SUPABASE = Publishable key

const cliente = window.supabase.createClient(
    URL_SUPABASE,
    CHAVE_SUPABASE
);

const formulario = document.getElementById("formCandidato");
const mensagem = document.getElementById("mensagem");

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    mensagem.style.display = "block";
    mensagem.innerHTML = "A processar o cadastro...";

    const dados = {
        nome_completo: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value,
        provincia: document.getElementById("provincia").value,
        area_profissional: document.getElementById("area").value,
        experiencia: document.getElementById("experiencia").value
    };

    try {

        const resultado = await cliente
            .from("candidatos")
            .insert([dados]);

        if (resultado.error) {

            mensagem.innerHTML =
                "<strong>ERRO:</strong><br>" +
                resultado.error.message;

            console.error(resultado.error);

            return;
        }

        mensagem.innerHTML =
            "<strong>SUCESSO!</strong><br>" +
            "O candidato foi registado na base de dados da RNO.";

        formulario.reset();

    } catch (erro) {

        mensagem.innerHTML =
            "<strong>ERRO:</strong><br>" +
            erro.message;

        console.error(erro);
    }

});

</script>

</body>
</html>
