<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Candidato - RNO</title>

    <style>

       
* {
    box-sizing: border-box;
}

:root {
    --azul-noite: #071426;
    --azul-profundo: #0b2342;
    --azul: #2563eb;
    --ciano: #06b6d4;
    --texto: #172033;
    --suave: #64748b;
    --borda: #dce5f1;
    --branco: #ffffff;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 16px 45px;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);
    background:
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, .30), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(6, 182, 212, .17), transparent 30%),
        linear-gradient(135deg, var(--azul-noite), var(--azul-profundo));
}

.container {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
}

.topo {
    text-align: center;
    margin-bottom: 26px;
    color: white;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 66px;
    height: 66px;
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 20px;
    background: linear-gradient(135deg, #3b82f6, var(--ciano));
    box-shadow: 0 10px 35px rgba(37, 99, 235, .35);
    color: white;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1px;
}

.nome-plataforma {
    margin-top: 12px;
    color: #dbeafe;
    font-size: 14px;
}

.form-card {
    padding: 38px;
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 24px;
    background: rgba(255, 255, 255, .98);
    box-shadow: 0 25px 70px rgba(0, 0, 0, .25);
    animation: aparecer .5s ease both;
}

h1 {
    margin: 0 0 10px;
    color: var(--azul-profundo);
    text-align: center;
    font-size: 29px;
    letter-spacing: -.6px;
}

.subtitulo {
    margin: 0 0 30px;
    color: var(--suave);
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
}

.campo {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #24334b;
    font-size: 14px;
    font-weight: 700;
}

input,
select,
textarea {
    display: block;
    width: 100%;
    min-height: 49px;
    padding: 13px 15px;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: #f8fafc;
    color: var(--texto);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--azul);
    background: white;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
}

input::placeholder,
textarea::placeholder {
    color: #94a3b8;
}

textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.6;
}

button {
    width: 100%;
    min-height: 52px;
    margin-top: 8px;
    padding: 14px 18px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    box-shadow: 0 8px 22px rgba(37, 99, 235, .24);
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 27px rgba(37, 99, 235, .32);
}

button:disabled {
    opacity: .65;
    cursor: not-allowed;
}

#mensagem {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #cfe0ff;
    border-radius: 12px;
    background: #eef4ff;
    color: #334155;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.voltar {
    display: block;
    margin-top: 23px;
    color: var(--azul);
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
}

.voltar:hover {
    text-decoration: underline;
}

.nota {
    margin-top: 22px;
    color: var(--suave);
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    body {
        padding: 22px 12px 30px;
    }

    .logo {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        font-size: 24px;
    }

    .form-card {
        padding: 27px 20px;
        border-radius: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .subtitulo {
        font-size: 14px;
        margin-bottom: 25px;
    }

    input,
    select,
    textarea {
        font-size: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}


    </style>

</head>

<body>

<div class="container">

    <!-- CABEÇALHO -->

    <div class="topo">

        <div class="logo">
            RNO
        </div>

        <div class="nome-plataforma">
            Rede Nacional de Oportunidades
        </div>

    </div>


    <!-- FORMULÁRIO -->

    <div class="form-card">

        <h1>
            Cadastro de Candidato
        </h1>

        <p class="subtitulo">
            Crie o seu perfil profissional na RNO
        </p>


        <form id="formCandidato">


            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o seu nome completo"
                    required
                >

            </div>


            <div class="campo">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Ex.: 84 000 0000"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite o seu email"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    minlength="6"
                    placeholder="Mínimo de 6 caracteres"
                    required
                >

            </div>


            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    minlength="6"
                    placeholder="Digite novamente a senha"
                    required
                >

            </div>


            <div class="campo">

                <label for="provincia">
                    Província
                </label>

                <select id="provincia" required>

                    <option value="">
                        Selecione a sua província
                    </option>

                    <option>
                        Maputo Cidade
                    </option>

                    <option>
                        Maputo Província
                    </option>

                    <option>
                        Gaza
                    </option>

                    <option>
                        Inhambane
                    </option>

                    <option>
                        Sofala
                    </option>

                    <option>
                        Manica
                    </option>

                    <option>
                        Tete
                    </option>

                    <option>
                        Zambézia
                    </option>

                    <option>
                        Nampula
                    </option>

                    <option>
                        Cabo Delgado
                    </option>

                    <option>
                        Niassa
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="area">
                    Área profissional
                </label>

                <input
                    type="text"
                    id="area"
                    placeholder="Ex.: Informática, Contabilidade, Marketing"
                    required
                >

            </div>


            <div class="campo">

                <label for="experiencia">
                    Experiência profissional
                </label>

                <textarea
                    id="experiencia"
                    placeholder="Descreva a sua experiência profissional"
                ></textarea>

            </div>


            <button
                type="submit"
                id="botao"
            >
                Criar Perfil
            </button>


        </form>


        <div id="mensagem"></div>


        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para a RNO
        </a>


        <p class="nota">
            🔒 Os seus dados são protegidos pela plataforma RNO.
        </p>

    </div>

</div>


<script>

    const SUPABASE_URL =
        "https://bwkpmirlwrsbeiavzapm.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";


    const formulario =
        document.getElementById("formCandidato");


    const mensagem =
        document.getElementById("mensagem");


    const botao =
        document.getElementById("botao");


    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const nome =
                document
                .getElementById("nome")
                .value
                .trim();


            const telefone =
                document
                .getElementById("telefone")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const provincia =
                document
                .getElementById("provincia")
                .value;


            const area =
                document
                .getElementById("area")
                .value
                .trim();


            const experiencia =
                document
                .getElementById("experiencia")
                .value
                .trim();


            const senha =
                document
                .getElementById("senha")
                .value;


            const confirmarSenha =
                document
                .getElementById("confirmarSenha")
                .value;


            if (senha !== confirmarSenha) {

                mensagem.style.display = "block";

                mensagem.innerHTML =
                    "<strong>As senhas não coincidem.</strong>";

                return;
            }


            mensagem.style.display = "block";

            mensagem.innerHTML =
                "A criar a sua conta...";


            botao.disabled = true;

            botao.textContent =
                "A criar conta...";


            try {

             
const resposta =
    await fetch(
        SUPABASE_URL +
        "/auth/v1/signup?redirect_to=" +
        encodeURIComponent(
            "https://leoprince084-stack.github.io/rno-platform/"
        ),
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
            },

            body: JSON.stringify({
                email: email,
                password: senha,

                data: {
                    tipo_conta: "candidato",
                    nome_completo: nome,
                    telefone: telefone,
                    provincia: provincia,
                    area_profissional: area,
                    experiencia: experiencia
                }
            })
        }
    );



                const resultado =
                    await resposta.json();


                console.log(
                    "Resposta do Supabase:",
                    resultado
                );


                if (!resposta.ok) {

                    mensagem.innerHTML =
                        "<strong>Erro ao criar a conta:</strong><br><br>" +
                        (
                            resultado.msg ||
                            resultado.message ||
                            "Não foi possível criar a conta."
                        );


                    botao.disabled = false;

                    botao.textContent =
                        "Criar Perfil";

                    return;
                }


                mensagem.innerHTML =
                    "<strong>✅ Conta criada com sucesso!</strong><br><br>" +
                    "Enviámos um e-mail de confirmação para <strong>" +
                    email +
                    "</strong>.<br><br>" +
                    "Abra o seu e-mail e confirme a sua conta para continuar.";


                formulario.reset();


                botao.disabled = false;

                botao.textContent =
                    "Criar Perfil";


            } catch (erro) {

                console.error(
                    "Erro de ligação:",
                    erro
                );


                mensagem.innerHTML =
                    "<strong>Erro de ligação:</strong><br><br>" +
                    erro.message;


                botao.disabled = false;

                botao.textContent =
                    "Criar Perfil";

            }

        }
    );

</script>

</body>
</html>
