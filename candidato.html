<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #eef4ff;
            line-height: 1.5;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Candidato</h1>

    <p class="subtitulo">
        Crie o seu perfil profissional na RNO
    </p>

    <form id="formCandidato">

        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>Telefone</label>
        <input type="tel" id="telefone" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label>Área profissional</label>
        <input type="text" id="area" required>

        <label>Experiência profissional</label>
        <textarea id="experiencia"></textarea>

        <button type="submit">
            Criar Perfil
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="index.html" class="voltar">
        ← Voltar para a RNO
    </a>

</div>

<script>
const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_A_TUA_CHAVE_REAL";
const formulario =
    document.getElementById("formCandidato");

const mensagem =
    document.getElementById("mensagem");

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    mensagem.style.display = "block";
    mensagem.innerHTML = "A guardar o cadastro...";

    const dados = {
        nome_completo:
            document.getElementById("nome").value.trim(),

        telefone:
            document.getElementById("telefone").value.trim(),

        email:
            document.getElementById("email").value.trim() || null,

        provincia:
            document.getElementById("provincia").value,

        area_profissional:
            document.getElementById("area").value.trim(),

        experiencia:
            document.getElementById("experiencia").value.trim()
    };

    try {

        const resposta = await fetch(
            SUPABASE_URL + "/rest/v1/candidatos",
            {
                method: "POST",

            headers: {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY,
    "Prefer": "return=minimal",

                body: JSON.stringify(dados)
            }
        );

        if (!resposta.ok) {

            const erro = await resposta.text();

            mensagem.innerHTML =
                "<strong>Erro no cadastro:</strong><br><br>" +
                erro;

            return;
        }

        mensagem.innerHTML =
            "<strong>✅ Cadastro realizado com sucesso!</strong><br>" +
            "O perfil foi guardado na RNO.";

        formulario.reset();

    } catch (erro) {

        mensagem.innerHTML =
            "<strong>Erro de ligação:</strong><br><br>" +
            erro.message;
    }

});
</script>

</body>
</html>
