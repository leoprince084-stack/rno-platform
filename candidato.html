<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #eef4ff;
            line-height: 1.5;
            word-break: break-word;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Candidato</h1>

    <p class="subtitulo">
        Crie o seu perfil profissional na RNO
    </p>

    <form id="formCandidato">

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" required>

     <label for="email">Email</label>
<input type="email" id="email" required>

<label for="senha">Senha</label>
<input type="password" id="senha" minlength="6" required>

<label for="confirmarSenha">Confirmar senha</label>
<input type="password" id="confirmarSenha" minlength="6" required>
        <label for="provincia">Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label for="area">Área profissional</label>
        <input
            type="text"
            id="area"
            placeholder="Ex.: Informática"
            required
        >

        <label for="experiencia">Experiência profissional</label>
        <textarea
            id="experiencia"
            placeholder="Descreva a sua experiência profissional"
        ></textarea>

        <button type="submit" id="botao">
            Criar Perfil
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="index.html" class="voltar">
        ← Voltar para a RNO
    </a>

</div>

<script>
   <script>
    const SUPABASE_URL =
        "https://bwkpmirlwrsbeiavzapm.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

    const formulario =
        document.getElementById("formCandidato");

    const mensagem =
        document.getElementById("mensagem");

    const botao =
        document.getElementById("botao");

    formulario.addEventListener("submit", async function(event) {

        event.preventDefault();

        const nome =
            document.getElementById("nome").value.trim();

        const telefone =
            document.getElementById("telefone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const provincia =
            document.getElementById("provincia").value;

        const area =
            document.getElementById("area").value.trim();

        const experiencia =
            document.getElementById("experiencia").value.trim();

        const senha =
            document.getElementById("senha").value;

        const confirmarSenha =
            document.getElementById("confirmarSenha").value;

        if (senha !== confirmarSenha) {

            mensagem.style.display = "block";

            mensagem.innerHTML =
                "<strong>As senhas não coincidem.</strong>";

            return;
        }

        mensagem.style.display = "block";
        mensagem.innerHTML =
            "A criar a sua conta...";

        botao.disabled = true;
        botao.textContent = "A criar conta...";

        try {

            /* 1. CRIAR CONTA NO SUPABASE AUTH */

            const cadastroAuth = await fetch(
                SUPABASE_URL + "/auth/v1/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY
                    },

                    body: JSON.stringify({
                        email: email,
                        password: senha
                    })
                }
            );

            const resultadoAuth =
                await cadastroAuth.json();

            if (!cadastroAuth.ok) {

                console.error(
                    "Erro Auth:",
                    resultadoAuth
                );

                mensagem.innerHTML =
                    "<strong>Erro ao criar a conta:</strong><br><br>" +
                    (resultadoAuth.msg ||
                     resultadoAuth.message ||
                     "Não foi possível criar a conta.");

                botao.disabled = false;
                botao.textContent = "Criar Perfil";

                return;
            }

            /* 2. PEGAR O ID DO UTILIZADOR */

            const userId =
                resultadoAuth.user?.id;

            if (!userId) {

                mensagem.innerHTML =
                    "<strong>Conta criada, mas não foi possível obter o ID do utilizador.</strong>";

                botao.disabled = false;
                botao.textContent = "Criar Perfil";

                return;
            }

            /* 3. CRIAR O PERFIL DO CANDIDATO */

            const dados = {

                id: userId,

                nome_completo: nome,

                telefone: telefone,

                email: email,

                provincia: provincia,

                area_profissional: area,

                experiencia: experiencia
            };

            const respostaPerfil = await fetch(
                SUPABASE_URL + "/rest/v1/candidatos",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Prefer": "return=minimal"
                    },

                    body: JSON.stringify(dados)
                }
            );

            if (!respostaPerfil.ok) {

                const erro =
                    await respostaPerfil.text();

                console.error(
                    "Erro perfil:",
                    erro
                );

                mensagem.innerHTML =
                    "<strong>A conta foi criada, mas houve um problema ao guardar o perfil:</strong><br><br>" +
                    erro;

                botao.disabled = false;
                botao.textContent = "Criar Perfil";

                return;
            }

            /* 4. SUCESSO */

            mensagem.innerHTML =
                "<strong>✅ Conta criada com sucesso!</strong><br><br>" +
                "O seu perfil foi registado na RNO.";

            formulario.reset();

            botao.disabled = false;
            botao.textContent = "Criar Perfil";

        } catch (erro) {

            console.error(
                "Erro de ligação:",
                erro
            );

            mensagem.innerHTML =
                "<strong>Erro de ligação:</strong><br><br>" +
                erro.message;

            botao.disabled = false;
            botao.textContent = "Criar Perfil";
        }
    });
</script>

</body>
</html>
