<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Empresa - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #eef4ff;
            line-height: 1.5;
            word-break: break-word;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Empresa</h1>

    <p class="subtitulo">
        Crie a conta e o perfil da sua empresa na RNO
    </p>

    <form id="formEmpresa">

        <label for="nomeEmpresa">Nome da empresa</label>
        <input
            type="text"
            id="nomeEmpresa"
            required
        >

        <label for="responsavel">Nome do responsável</label>
        <input
            type="text"
            id="responsavel"
            required
        >

        <label for="telefone">Telefone</label>
        <input
            type="tel"
            id="telefone"
            required
        >

       <label for="email">E-mail</label>
<input type="email" id="email" required>

<label for="senha">Senha</label>
<input
    type="password"
    id="senha"
    minlength="6"
    required
    placeholder="Mínimo de 6 caracteres"
>

<label for="confirmarSenha">Confirmar senha</label>
<input
    type="password"
    id="confirmarSenha"
    minlength="6"
    required
    placeholder="Digite a mesma senha"
>

        <label for="provincia">Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label for="area">Área de atuação</label>
        <input
            type="text"
            id="area"
            placeholder="Ex.: Construção, Tecnologia, Comércio"
            required
        >

        <label for="descricao">Descrição da empresa</label>
        <textarea
            id="descricao"
            placeholder="Descreva brevemente a sua empresa"
        ></textarea>

        <button type="submit" id="botao">
            Criar Conta da Empresa
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="index.html" class="voltar">
        ← Voltar para a RNO
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

const formulario =
    document.getElementById("formEmpresa");

const mensagem =
    document.getElementById("mensagem");

const botao =
    document.getElementById("botao");


formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    const nomeEmpresa =
        document.getElementById("nomeEmpresa").value.trim();

    const responsavel =
        document.getElementById("responsavel").value.trim();

    const telefone =
        document.getElementById("telefone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;

    const confirmarSenha =
        document.getElementById("confirmarSenha").value;

    const provincia =
        document.getElementById("provincia").value;

    const area =
        document.getElementById("area").value.trim();

    const descricao =
        document.getElementById("descricao").value.trim();


    if (senha !== confirmarSenha) {

        mensagem.style.display = "block";

        mensagem.innerHTML =
            "<strong>As senhas não coincidem.</strong>";

        return;
    }


    mensagem.style.display = "block";

    mensagem.innerHTML =
        "A criar a conta da empresa...";

    botao.disabled = true;

    botao.textContent =
        "A criar conta...";


    try {

        const resposta =
            await fetch(
                SUPABASE_URL + "/auth/v1/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY
                    },

                    body: JSON.stringify({

                        email: email,

                        password: senha,

                        data: {

                            tipo_conta: "empresa",

                            nome_empresa: nomeEmpresa,

                            responsavel: responsavel,

                            telefone: telefone,

                            provincia: provincia,

                            area_atuacao: area,

                            descricao: descricao

                        }

                    })
                }
            );


        const resultado =
            await resposta.json();


        console.log(
            "Resposta do Supabase:",
            resultado
        );


        if (!resposta.ok) {

            mensagem.innerHTML =
                "<strong>Erro ao criar a conta:</strong><br><br>" +
                (
                    resultado.msg ||
                    resultado.message ||
                    resultado.error_description ||
                    "Não foi possível criar a conta."
                );

            botao.disabled = false;

            botao.textContent =
                "Criar Conta da Empresa";

            return;
        }


        /*
         * O Supabase criou a conta.
         * Agora precisamos do ID do utilizador.
         */

        const userId =
            resultado.user?.id;


        if (!userId) {

            mensagem.innerHTML =
                "<strong>Conta criada.</strong><br><br>" +
                "Confirme o seu email para continuar.";

            formulario.reset();

            botao.disabled = false;

            botao.textContent =
                "Criar Conta da Empresa";

            return;
        }


        /*
         * Criar o perfil da empresa
         * usando o mesmo ID do Auth.
         */

        const respostaEmpresa =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/empresas",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Profile":
                            "public",

                        "Prefer":
                            "return=minimal"

                    },

                    body: JSON.stringify({

                        id: userId,

                        nome_empresa:
                            nomeEmpresa,

                        responsavel:
                            responsavel,

                        telefone:
                            telefone,

                        email:
                            email,

                        provincia:
                            provincia,

                        area_atuacao:
                            area,

                        descricao:
                            descricao || null

                    })
                }
            );


        const resultadoEmpresa =
            await respostaEmpresa.text();


        if (!respostaEmpresa.ok) {

            console.error(
                "Erro ao criar perfil:",
                resultadoEmpresa
            );

            mensagem.innerHTML =
                "<strong>Conta criada, mas houve um problema ao guardar o perfil da empresa.</strong><br><br>" +
                resultadoEmpresa;

            botao.disabled = false;

            botao.textContent =
                "Criar Conta da Empresa";

            return;
        }


        mensagem.innerHTML =
            "<strong>✅ CONTA DA EMPRESA CRIADA!</strong><br><br>" +
            "Enviámos um email de confirmação para <strong>" +
            email +
            "</strong>.<br><br>" +
            "Abra o seu email e confirme a conta para continuar.";


        formulario.reset();

        botao.disabled = false;

        botao.textContent =
            "Criar Conta da Empresa";

    } catch (erro) {

        console.error(
            "Erro de ligação:",
            erro
        );

        mensagem.innerHTML =
            "<strong>Erro de ligação:</strong><br><br>" +
            erro.message;

        botao.disabled = false;

        botao.textContent =
            "Criar Conta da Empresa";

    }

});

</script>

</body>
</html>
