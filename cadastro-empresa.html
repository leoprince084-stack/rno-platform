<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Empresa - RNO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }

        #mensagem {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Empresa</h1>

    <p class="subtitulo">
        Crie o perfil da sua empresa na RNO
    </p>

    <form id="formEmpresa">

        <label>Nome da empresa</label>
        <input type="text" id="nomeEmpresa" required>

        <label>Nome do responsável</label>
        <input type="text" id="responsavel" required>

        <label>Telefone</label>
        <input type="tel" id="telefone" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Província</label>
        <select id="provincia" required>
            <option value="">Selecione</option>
            <option>Maputo Cidade</option>
            <option>Maputo Província</option>
            <option>Gaza</option>
            <option>Inhambane</option>
            <option>Sofala</option>
            <option>Manica</option>
            <option>Tete</option>
            <option>Zambézia</option>
            <option>Nampula</option>
            <option>Cabo Delgado</option>
            <option>Niassa</option>
        </select>

        <label>Área de atuação</label>
        <input type="text" id="areaAtuacao" required>

        <label>Descrição da empresa</label>
        <textarea id="descricao"
            placeholder="Descreva brevemente a sua empresa"></textarea>

        <button type="submit" id="botao">
            Criar Perfil da Empresa
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="index.html" class="voltar">
        ← Voltar para a RNO
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document
    .getElementById("formEmpresa")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const mensagem =
            document.getElementById("mensagem");

        const botao =
            document.getElementById("botao");

        mensagem.textContent =
            "A guardar o cadastro da empresa...";

        botao.disabled = true;

        try {

            const {
                data: {
                    user
                },
                error: erroUsuario
            } = await supabaseClient.auth.getUser();

            if (erroUsuario || !user) {

                mensagem.textContent =
                    "É necessário iniciar sessão antes de criar o perfil da empresa.";

                botao.disabled = false;

                return;
            }


            const { error } =
                await supabaseClient
                    .from("empresas")
                    .insert({
                        id: user.id,

                        nome_empresa:
                            document.getElementById("nomeEmpresa").value.trim(),

                        responsavel:
                            document.getElementById("responsavel").value.trim(),

                        telefone:
                            document.getElementById("telefone").value.trim(),

                        email:
                            document.getElementById("email").value.trim() || null,

                        provincia:
                            document.getElementById("provincia").value,

                        area_atuacao:
                            document.getElementById("areaAtuacao").value.trim(),

                        descricao:
                            document.getElementById("descricao").value.trim() || null
                    });


            if (error) {

                console.error(error);

                mensagem.textContent =
                    "Não foi possível concluir o cadastro da empresa.";

                botao.disabled = false;

                return;
            }


            mensagem.textContent =
                "Cadastro da empresa realizado com sucesso!";

            document
                .getElementById("formEmpresa")
                .reset();

            botao.disabled = false;

        } catch (erro) {

            console.error(erro);

            mensagem.textContent =
                "Ocorreu um erro. Tente novamente.";

            botao.disabled = false;
        }

    });

</script>

</body>
</html>
