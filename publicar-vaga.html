<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar Vaga | RNO</title>

    <style>
      
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #0e2039;
    --azul: #2878f0;
    --azul-claro: #55a5ff;
    --texto: #f1f6ff;
    --texto-secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(ellipse at top left, rgba(25, 93, 190, 0.25), transparent 45%),
        linear-gradient(145deg, #071426, #0a1930 55%, #101d3c);
    color: var(--texto);
    line-height: 1.6;
}

header {
    padding: 28px 20px;
    text-align: center;
    background: rgba(7, 20, 38, 0.82);
    border-bottom: 1px solid var(--borda);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
}

header h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #ffffff, #69b1ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

header p {
    color: var(--texto-secundario);
    font-size: 14px;
}

.container {
    width: min(100% - 32px, 800px);
    margin: 42px auto;
}

.card {
    background: linear-gradient(145deg, rgba(17, 39, 68, 0.97), rgba(10, 27, 49, 0.98));
    border: 1px solid var(--borda);
    border-radius: 22px;
    padding: 34px;
    box-shadow: 0 24px 65px rgba(0, 0, 0, 0.28);
    animation: aparecer 0.45s ease-out;
}

h2 {
    color: #ffffff;
    font-size: clamp(23px, 4vw, 30px);
    line-height: 1.3;
    margin-bottom: 10px;
}

.intro {
    color: var(--texto-secundario);
    margin-bottom: 28px;
}

label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    color: #e2edff;
    margin-top: 20px;
    margin-bottom: 8px;
}

input,
textarea,
select {
    display: block;
    width: 100%;
    padding: 14px 15px;
    border: 1px solid var(--borda);
    border-radius: 11px;
    background: #09182c;
    color: var(--texto);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

input::placeholder,
textarea::placeholder {
    color: #8295b1;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--azul-claro);
    background: #0b1d35;
    box-shadow: 0 0 0 3px rgba(40, 120, 240, 0.16);
}

select option {
    background: #0e2039;
    color: #ffffff;
}

textarea {
    min-height: 125px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 28px;
    padding: 16px 20px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(110deg, #1764db, #328cff);
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(28, 104, 227, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(28, 104, 227, 0.38);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#mensagem {
    display: none;
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 11px;
    text-align: center;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.sucesso {
    display: block !important;
    background: rgba(22, 163, 74, 0.14);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: #86efac;
}

.erro {
    display: block !important;
    background: rgba(220, 38, 38, 0.13);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: #fca5a5;
}

.voltar {
    display: inline-block;
    margin-top: 24px;
    color: #78b8ff;
    text-decoration: none;
    font-weight: 700;
    transition: color 0.2s ease;
}

.voltar:hover {
    color: #ffffff;
    text-decoration: underline;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    header {
        padding: 22px 16px;
    }

    header h1 {
        font-size: 28px;
    }

    .container {
        width: min(100% - 22px, 800px);
        margin: 24px auto;
    }

    .card {
        padding: 22px 17px;
        border-radius: 17px;
    }

    h2 {
        font-size: 23px;
    }

    input,
    textarea,
    select {
        padding: 13px;
        font-size: 16px;
    }

    button {
        padding: 15px 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

    </style>
</head>

<body>

<header>
    <h1>RNO</h1>
    <p>Rede Nacional de Oportunidades</p>
</header>

<div class="container">

    <div class="card">

        <h2>📢 Publicar uma vaga</h2>

        <p class="intro">
            Encontre profissionais através da Rede Nacional de Oportunidades.
        </p>

        <form id="formVaga">

            <label for="titulo">Título da vaga *</label>
            <input
                type="text"
                id="titulo"
                placeholder="Ex.: Assistente Administrativo"
                required
            >

            <label for="localizacao">Localização *</label>
            <input
                type="text"
                id="localizacao"
                placeholder="Ex.: Maputo"
                required
            >

            <label for="tipo">Tipo de trabalho *</label>

            <select id="tipo" required>
                <option value="">Selecione</option>
                <option value="Tempo inteiro">Tempo inteiro</option>
                <option value="Tempo parcial">Tempo parcial</option>
                <option value="Estágio">Estágio</option>
                <option value="Freelance">Freelance</option>
                <option value="Trabalho remoto">Trabalho remoto</option>
            </select>

            <label for="descricao">Descrição da vaga *</label>

            <textarea
                id="descricao"
                placeholder="Explique as principais funções da vaga..."
                required
            ></textarea>

            <label for="requisitos">Requisitos *</label>

            <textarea
                id="requisitos"
                placeholder="Indique os requisitos necessários..."
                required
            ></textarea>

            <label for="salario">Salário</label>

            <input
                type="text"
                id="salario"
                placeholder="Ex.: 20.000 MT ou A combinar"
            >

            <label for="contacto">Contacto *</label>

            <input
                type="text"
                id="contacto"
                placeholder="Ex.: 879395804"
                required
            >

            <button type="submit" id="botao">
                PUBLICAR VAGA
            </button>

        </form>

        <div id="mensagem"></div>

        <a
            class="voltar"
            href="dashboard-empresa.html"
        >
            ← Voltar para o painel da empresa
        </a>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";


const formulario =
    document.getElementById("formVaga");

const mensagem =
    document.getElementById("mensagem");

const botao =
    document.getElementById("botao");


formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    mensagem.className = "";
    mensagem.style.display = "none";

    botao.disabled = true;
    botao.textContent = "A PUBLICAR...";


    const accessToken =
        localStorage.getItem("rno_access_token");


    if (!accessToken) {

        mensagem.textContent =
            "❌ A sessão da empresa expirou. Faça login novamente.";

        mensagem.className = "erro";

        botao.disabled = false;
        botao.textContent = "PUBLICAR VAGA";

        return;
    }


   const dados = {
    titulo: document.getElementById("titulo").value.trim(),
    empresa: "RNO",
    empresa_id: localStorage.getItem("rno_user_id"),
    localizacao: document.getElementById("localizacao").value.trim(),
        tipo:
            document.getElementById("tipo").value,

        descricao:
            document.getElementById("descricao").value.trim(),

        requisitos:
            document.getElementById("requisitos").value.trim(),

        salario:
            document.getElementById("salario").value.trim() || null,

        contacto:
            document.getElementById("contacto").value.trim()

    };


    try {

        const resposta = await fetch(
            SUPABASE_URL + "/rest/v1/vagas",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken,
                    "Content-Profile": "public",
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(dados)
            }
        );


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            console.error(
                "Erro Supabase:",
                erro
            );

            throw new Error(
                "Erro " +
                resposta.status +
                ": " +
                erro
            );
        }


        mensagem.textContent =
            "✅ VAGA PUBLICADA COM SUCESSO!";

        mensagem.className =
            "sucesso";

        formulario.reset();


    } catch (erro) {

        console.error(
            "Erro:",
            erro
        );

        mensagem.textContent =
            "❌ " +
            erro.message;

        mensagem.className =
            "erro";

    }


    botao.disabled = false;

    botao.textContent =
        "PUBLICAR VAGA";

});

</script>

</body>
</html>
