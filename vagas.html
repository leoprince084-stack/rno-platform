<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oportunidades de Emprego - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .inicio {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .filtros {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .vagas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .vaga {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .vaga h2 {
            color: #0b5ed7;
            margin-top: 0;
        }

        .empresa {
            font-weight: bold;
        }

        .info {
            color: #666;
            margin: 8px 0;
        }

        .btn-candidatar {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .sem-resultados {
            display: none;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RNO</div>

    <a href="index.html" class="inicio">
        Início
    </a>
</header>

<div class="container">

    <h1>Oportunidades de Emprego</h1>

    <p class="subtitulo">
        Encontre oportunidades de trabalho em Moçambique
    </p>

    <div class="filtros">

        <div class="filtros-grid">

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar vaga ou profissão..."
            >

            <select id="provincia">
                <option value="">Todas as províncias</option>
                <option value="Maputo">Maputo</option>
                <option value="Gaza">Gaza</option>
                <option value="Inhambane">Inhambane</option>
                <option value="Sofala">Sofala</option>
                <option value="Manica">Manica</option>
                <option value="Tete">Tete</option>
                <option value="Zambézia">Zambézia</option>
                <option value="Nampula">Nampula</option>
                <option value="Cabo Delgado">Cabo Delgado</option>
                <option value="Niassa">Niassa</option>
            </select>

            <select id="tipo">
                <option value="">Todos os tipos</option>
                <option value="Tempo inteiro">Tempo inteiro</option>
                <option value="Tempo parcial">Tempo parcial</option>
                <option value="Estágio">Estágio</option>
                <option value="Freelancer">Freelancer</option>
            </select>
<div class="vagas" id="listaVagas">
</div>

    <div id="semResultados" class="sem-resultados">
        <h2>Nenhuma oportunidade encontrada</h2>
        <p>Tente alterar os filtros.</p>
    </div>

    <a href="index.html" class="voltar">
        ← Voltar para a RNO
    </a>

</div>

<footer>
    © 2026 RNO - Rede Nacional de Oportunidades
</footer>

<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

const pesquisa =
    document.getElementById("pesquisa");

const provincia =
    document.getElementById("provincia");

const tipo =
    document.getElementById("tipo");

const listaVagas =
    document.getElementById("listaVagas");

let todasAsVagas = [];

async function carregarVagas() {

    try {

        const resposta = await fetch(
            SUPABASE_URL +
            "/rest/v1/vagas?select=*&order=created_at.desc",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Accept-Profile": "public"
                }
            }
        );

        const texto =
            await resposta.text();

        console.log("STATUS:", resposta.status);
        console.log("RESPOSTA:", texto);

        if (!resposta.ok) {
            throw new Error(
                "Erro ao carregar vagas. Status: " +
                resposta.status
            );
        }

        todasAsVagas =
            JSON.parse(texto);

        mostrarVagas();

    } catch (erro) {

        console.error(
            "ERRO DAS VAGAS:",
            erro
        );

        listaVagas.innerHTML =
            "<p style='text-align:center;'>" +
            "Não foi possível carregar as oportunidades." +
            "</p>";

    }

}

function mostrarVagas() {

    const texto =
        pesquisa.value
        .toLowerCase()
        .trim();

    const provinciaSelecionada =
        provincia.value;

    const tipoSelecionado =
        tipo.value;

    const resultados =
        todasAsVagas.filter(function(vaga) {

            const titulo =
                (vaga.titulo || "")
                .toLowerCase();

            const empresa =
                (vaga.empresa || "")
                .toLowerCase();

            const localizacao =
                vaga.localizacao || "";

            const tipoVaga =
                vaga.tipo || "";

            const encontrouTexto =
                titulo.includes(texto) ||
                empresa.includes(texto);

            const encontrouProvincia =
                provinciaSelecionada === "" ||
                localizacao === provinciaSelecionada;

            const encontrouTipo =
                tipoSelecionado === "" ||
                tipoVaga === tipoSelecionado;

            return (
                encontrouTexto &&
                encontrouProvincia &&
                encontrouTipo
            );

        });

    listaVagas.innerHTML = "";

    resultados.forEach(function(vaga) {

        const cartao =
            document.createElement("div");

        cartao.className = "vaga";

        cartao.innerHTML = `

            <h2>${vaga.titulo || "Sem título"}</h2>

            <p class="empresa">
                Empresa: ${vaga.empresa || "Não informado"}
            </p>

            <p class="info">
                📍 ${vaga.localizacao || "Não informado"}
            </p>

            <p class="info">
                💼 ${vaga.tipo || "Não informado"}
            </p>

            <p class="info">
                💰 ${vaga.salario || "A combinar"}
            </p>

            <p class="info">
                ${vaga.descricao || ""}
            </p>

            <a
                href="candidatar.html?vaga=${encodeURIComponent(vaga.titulo || "")}"
                class="btn-candidatar">
                Candidatar-se
            </a>

        `;

        listaVagas.appendChild(cartao);

    });

    document.getElementById(
        "contador"
    ).textContent =
        resultados.length +
        " oportunidade(s) encontrada(s)";

    document.getElementById(
        "semResultados"
    ).style.display =
        resultados.length === 0
        ? "block"
        : "none";

}

pesquisa.addEventListener(
    "input",
    mostrarVagas
);

provincia.addEventListener(
    "change",
    mostrarVagas
);

tipo.addEventListener(
    "change",
    mostrarVagas
);

carregarVagas();

</script>
</body>
</html>
