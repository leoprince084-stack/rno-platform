name: RNO Mobile Web Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extrair o projeto RNO
        shell: bash
        run: |
          test -f RNO_Mobile_Projeto_v19.zip
          mkdir -p "$RUNNER_TEMP/rno-mobile-source"
          unzip -q RNO_Mobile_Projeto_v19.zip -d "$RUNNER_TEMP/rno-mobile-source"
          test -f "$RUNNER_TEMP/rno-mobile-source/RNO_Mobile_Projeto_V17/package.json"
          test -f "$RUNNER_TEMP/rno-mobile-source/RNO_Mobile_Projeto_V17/App.js"

      - name: Configurar caminho web
        shell: bash
        run: |
          node - "$RUNNER_TEMP/rno-mobile-source/RNO_Mobile_Projeto_V17/app.json" <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.expo = config.expo || {};
          config.expo.experiments = config.expo.experiments || {};
          config.expo.experiments.baseUrl = "/rno-platform/mobile";
          config.expo.web = config.expo.web || {};
          config.expo.web.bundler = "metro";
          config.expo.web.output = "single";
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Instalar dependencias
        working-directory: ${{ runner.temp }}/rno-mobile-source/RNO_Mobile_Projeto_V17
        run: npm install --no-audit --no-fund

      - name: Compilar para web
        working-directory: ${{ runner.temp }}/rno-mobile-source/RNO_Mobile_Projeto_V17
        run: npx expo export --platform web

      - name: Preparar o site
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_site/mobile"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.zip' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            "$GITHUB_WORKSPACE/" "$GITHUB_WORKSPACE/_site/"
          rsync -a \
            "$RUNNER_TEMP/rno-mobile-source/RNO_Mobile_Projeto_V17/dist/" \
            "$GITHUB_WORKSPACE/_site/mobile/"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"
          test -f "$GITHUB_WORKSPACE/_site/index.html"
          test -f "$GITHUB_WORKSPACE/_site/mobile/index.html"

      - name: Enviar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar preview
        id: deployment
        uses: actions/deploy-pages@v4
