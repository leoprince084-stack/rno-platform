
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidaturas Recebidas | RNO</title>
  <style>
   :root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #10223d;
    --azul: #2878f0;
    --azul-claro: #66b0ff;
    --texto: #f1f6ff;
    --secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(ellipse at top left, #163d70 0%, transparent 45%),
        linear-gradient(135deg, #071426, #0b1d35 55%, #10294a);
    color: var(--texto);
    min-height: 100vh;
}

header {
    background: rgba(7, 20, 38, 0.82);
    border-bottom: 1px solid var(--borda);
    padding: 26px 5%;
    backdrop-filter: blur(12px);
}

header h1 {
    margin: 0 0 10px;
    font-size: clamp(23px, 4vw, 32px);
    line-height: 1.25;
    letter-spacing: -0.5px;
}

header p {
    margin: 0;
    color: var(--secundario);
    line-height: 1.6;
}

main {
    width: min(1100px, 92%);
    margin: 32px auto;
}

.topo,
.candidatura {
    background: linear-gradient(
        145deg,
        rgba(18, 41, 69, 0.97),
        rgba(13, 29, 51, 0.97)
    );
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 16px 38px rgba(0, 0, 0, 0.16);
    animation: entrada 0.45s ease both;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.topo h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.4;
}

.botao {
    display: inline-block;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 17px;
    background: linear-gradient(135deg, var(--azul), #1760d0);
    color: white;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
    transition: transform 0.2s, filter 0.2s;
}

.botao:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.botao:focus-visible {
    outline: 2px solid var(--azul-claro);
    outline-offset: 3px;
}

.secundario {
    background: #263c59;
    border-color: var(--borda);
    color: var(--texto);
}

.vaga {
    color: var(--azul-claro);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.candidatura h3 {
    margin: 10px 0 20px;
    font-size: 21px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.detalhes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
}

.detalhes p {
    margin: 5px 0;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

.rotulo {
    color: var(--secundario);
    font-size: 12px;
    letter-spacing: 0.3px;
}

.valor {
    color: var(--texto);
    font-size: 14px;
}

.mensagem {
    padding: 16px;
    background: rgba(40, 120, 240, 0.12);
    border: 1px solid rgba(102, 176, 255, 0.2);
    border-radius: 12px;
    margin-bottom: 18px;
    color: var(--texto);
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.erro {
    background: rgba(220, 38, 38, 0.13);
    border-color: rgba(248, 113, 113, 0.3);
    color: #fecaca;
}

.vazio {
    text-align: center;
    padding: 42px 18px;
    color: var(--secundario);
    line-height: 1.7;
}

footer {
    text-align: center;
    color: var(--secundario);
    padding: 24px 16px;
    font-size: 13px;
    line-height: 1.6;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    header {
        padding: 23px 5%;
    }

    main {
        width: 92%;
        margin: 22px auto;
    }

    .topo,
    .candidatura {
        padding: 19px;
        border-radius: 15px;
    }

    .topo {
        align-items: stretch;
    }

    .topo .botao {
        text-align: center;
    }

    .detalhes {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .candidatura h3 {
        font-size: 19px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
  </style>
</head>
<body>
  <header>
    <h1>RNO — Rede Nacional de Oportunidades</h1>
    <p>Área da empresa · Gestão de candidaturas</p>
  </header>

  <main>
    <div class="topo">
      <div>
        <h2>Candidaturas recebidas</h2>
        <p id="resumo">A preparar a consulta...</p>
      </div>
      <div>
        <button class="botao" id="atualizar" type="button">Atualizar</button>
        <a class="botao secundario" href="dashboard-empresa.html">Voltar ao painel</a>
      </div>
    </div>

    <div id="mensagem" class="mensagem" role="status" aria-live="polite">
      A carregar candidaturas...
    </div>
    <section id="lista"></section>
  </main>

  <footer>RNO · Rede Nacional de Oportunidades</footer>

  <script>
    const SUPABASE_URL = "https://bwkpmirlwrsbeiavzapm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

    const lista = document.getElementById("lista");
    const mensagem = document.getElementById("mensagem");
    const resumo = document.getElementById("resumo");

    function mostrarMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? "mensagem erro" : "mensagem";
      mensagem.style.display = "block";
    }

    function formatarData(data) {
      if (!data) return "Não indicada";
      const dataValida = new Date(data);
      if (Number.isNaN(dataValida.getTime())) return "Não indicada";
      return dataValida.toLocaleString("pt-PT");
    }

    function criarCampo(rotulo, valor) {
      const caixa = document.createElement("div");
      const titulo = document.createElement("div");
      titulo.className = "rotulo";
      titulo.textContent = rotulo;

      const texto = document.createElement("p");
      texto.className = "valor";
      texto.textContent = valor || "Não informado";

      caixa.append(titulo, texto);
      return caixa;
    }

    async function carregarCandidaturas() {
      lista.replaceChildren();
      resumo.textContent = "A carregar...";
      mostrarMensagem("A consultar as candidaturas da tua empresa...");

      const accessToken = localStorage.getItem("rno_access_token");
      const userId = localStorage.getItem("rno_user_id");
      const tipoConta = localStorage.getItem("rno_tipo_conta");

      if (!accessToken || !userId || tipoConta !== "empresa") {
        mostrarMensagem(
          "Sessão de empresa não encontrada. Entra novamente através do login da empresa.",
          true
        );
        resumo.textContent = "Sessão necessária";
        return;
      }

      const cabecalhos = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Accept": "application/json",
        "Accept-Profile": "public"
      };

      try {
        const respostaVagas = await fetch(
          SUPABASE_URL + "/rest/v1/vagas?empresa_id=eq." +
          encodeURIComponent(userId) + "&select=id,titulo",
          { headers: cabecalhos }
        );

        if (!respostaVagas.ok) {
          throw new Error("Não foi possível consultar as vagas. Código: " + respostaVagas.status);
        }

        const vagas = await respostaVagas.json();

        if (!vagas.length) {
          resumo.textContent = "0 candidaturas";
          mostrarMensagem("Ainda não tens vagas publicadas nesta conta.");
          return;
        }

        const mapaVagas = new Map(vagas.map(vaga => [
          vaga.id,
          vaga.titulo || "Vaga sem título"
        ]));

        const idsVagas = vagas.map(vaga => vaga.id);
        const filtro = idsVagas.join(",");

        const urlCandidaturas = SUPABASE_URL +
          "/rest/v1/candidaturas?vaga_id=in.(" +
          encodeURIComponent(filtro) +
          ")&select=id,vaga_id,nome_completo,email,telefone,created_at";

        const respostaCandidaturas = await fetch(urlCandidaturas, {
          headers: cabecalhos
        });

        if (!respostaCandidaturas.ok) {
          throw new Error(
            "Não foi possível consultar as candidaturas. Código: " +
            respostaCandidaturas.status
          );
        }

        const candidaturas = await respostaCandidaturas.json();

        candidaturas.sort((a, b) =>
          new Date(b.created_at || 0) - new Date(a.created_at || 0)
        );

        resumo.textContent = candidaturas.length +
          (candidaturas.length === 1 ? " candidatura" : " candidaturas");

        if (!candidaturas.length) {
          mostrarMensagem("As tuas vagas ainda não receberam candidaturas.");
          return;
        }

        mensagem.style.display = "none";

        candidaturas.forEach((candidatura, indice) => {
          const cartao = document.createElement("article");
          cartao.className = "candidatura";

          const tituloVaga = document.createElement("div");
          tituloVaga.className = "vaga";
          tituloVaga.textContent =
            mapaVagas.get(candidatura.vaga_id) || "Vaga não identificada";

          const titulo = document.createElement("h3");
          titulo.textContent =
            candidatura.nome_completo || "Nome não informado";

          const detalhes = document.createElement("div");
          detalhes.className = "detalhes";
          detalhes.append(
            criarCampo("E-mail", candidatura.email),
            criarCampo("Telefone", candidatura.telefone),
            criarCampo("Data da candidatura", formatarData(candidatura.created_at))
          );

          const numero = document.createElement("p");
          numero.className = "rotulo";
          numero.textContent = "Candidatura #" + (indice + 1);

          cartao.append(tituloVaga, titulo, detalhes, numero);
          lista.appendChild(cartao);
        });

      } catch (erro) {
        console.error("Erro ao carregar candidaturas:", erro);
        mostrarMensagem(
          erro.message || "Ocorreu um erro ao carregar as candidaturas.",
          true
        );
        resumo.textContent = "Consulta não concluída";
      }
    }

    document.getElementById("atualizar").addEventListener(
      "click", carregarCandidaturas
    );

    carregarCandidaturas();
  </script>
</body>
</html>
