
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar palavra-passe | RNO</title>
    <style>
        :root {
    color-scheme: dark;
    --fundo: #071426;
    --painel: #10223d;
    --azul: #2878f0;
    --azul-claro: #66b0ff;
    --texto: #f1f6ff;
    --secundario: #a9bad2;
    --borda: rgba(145, 180, 230, 0.2);
}

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(ellipse at top left, #163d70 0%, transparent 48%),
        linear-gradient(135deg, #071426, #0b1d35 55%, #10294a);
    color: var(--texto);
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.caixa {
    background: linear-gradient(
        145deg,
        rgba(18, 41, 69, 0.98),
        rgba(13, 29, 51, 0.98)
    );
    width: 100%;
    max-width: 440px;
    padding: 34px;
    border: 1px solid var(--borda);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    animation: entrada 0.55s ease both;
}

h1 {
    color: var(--texto);
    text-align: center;
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 20px;
}

p {
    color: var(--secundario);
    line-height: 1.7;
    font-size: 15px;
}

input,
button {
    width: 100%;
    padding: 14px 15px;
    margin-top: 14px;
    border-radius: 11px;
    font-size: 16px;
    font-family: inherit;
}

input {
    color: var(--texto);
    background: #09182b;
    border: 1px solid var(--borda);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
    color: #8195b1;
}

input:focus {
    border-color: var(--azul-claro);
    box-shadow: 0 0 0 3px rgba(40, 120, 240, 0.16);
}

button {
    border: none;
    background: linear-gradient(135deg, var(--azul), #1760d0);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(40, 120, 240, 0.22);
    transition: transform 0.2s, filter 0.2s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

button:active:not(:disabled) {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#mensagem {
    margin-top: 18px;
    overflow-wrap: anywhere;
    line-height: 1.6;
    font-size: 14px;
}

a {
    color: var(--azul-claro);
    text-decoration: none;
    transition: color 0.2s;
}

a:hover {
    color: white;
    text-decoration: underline;
}

.voltar {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .caixa {
        padding: 25px 20px;
        border-radius: 18px;
    }

    h1 {
        font-size: 24px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
    </style>
</head>
<body>
    <main class="caixa">
        <h1>RNO</h1>
        <h2>Recuperar palavra-passe</h2>

        <p>
            Introduz o teu email registado na RNO.
            Se a recuperação estiver disponível, receberás uma ligação
            para definires uma nova palavra-passe.
        </p>

        <form id="formRecuperar">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="Digite o seu email"
            >

            <button type="submit" id="botaoEnviar">
                Enviar ligação de recuperação
            </button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <div class="voltar">
            <a href="login.html">Voltar para o login</a>
        </div>
    </main>

    <script>
        const SUPABASE_URL =
            "https://bwkpmirlwrsbeiavzapm.supabase.co";

     
const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";



        const form = document.getElementById("formRecuperar");
        const campoEmail = document.getElementById("email");
        const botao = document.getElementById("botaoEnviar");
        const mensagem = document.getElementById("mensagem");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = campoEmail.value.trim();

            mensagem.textContent = "";
            botao.disabled = true;
            botao.textContent = "A enviar...";

            try {
                const destino =
                    "https://leoprince084-stack.github.io/rno-platform/nova-senha.html";

                const resposta = await fetch(
                    SUPABASE_URL +
                    "/auth/v1/recover?redirect_to=" +
                    encodeURIComponent(destino),
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY
                        },
                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

                if (!resposta.ok) {
                    const erro = await resposta.json().catch(() => ({}));
                    throw new Error(
                        erro.msg ||
                        erro.message ||
                        erro.error_description ||
                        "Não foi possível enviar o pedido."
                    );
                }

                mensagem.textContent =
                    "Pedido enviado. Verifica a tua caixa de entrada e a pasta de spam.";
                mensagem.style.color = "#176b37";

            } catch (erro) {
                console.error("Erro na recuperação:", erro);

                mensagem.textContent =
                    "Não foi possível enviar o pedido. Verifica a ligação e a configuração do Supabase. Se aparecer um limite de emails, aguarda antes de tentar novamente.";
                mensagem.style.color = "#b42318";

            } finally {
                botao.disabled = false;
                botao.textContent = "Enviar ligação de recuperação";
            }
        });
    </script>
</body>
</html>
