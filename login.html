<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - RNO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d50;
        }

        #mensagem {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .cadastro a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>RNO</h1>

        <p class="subtitulo">Rede Nacional de Oportunidades</p>

        <form id="formLogin">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
                placeholder="Digite o seu email"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                required
                placeholder="Digite a sua senha"
            >

            <button type="submit" id="botao">
                ENTRAR
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="cadastro">
            Ainda não tem uma conta?
            <a href="candidato.html">Criar conta</a>
        </div>

    </div>

    <script>

        const SUPABASE_URL =
            "https://bwkpmirlwrsbeiavzapm.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

        const formulario = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("botao");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "A entrar...";
            mensagem.style.color = "#123c69";
            botao.disabled = true;

            try {

                const resposta = await fetch(
                    SUPABASE_URL + "/auth/v1/token?grant_type=password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY
                        },

                        body: JSON.stringify({
                            email: email,
                            password: senha
                        })
                    }
                );

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        dados.error_description ||
                        dados.msg ||
                        "Email ou senha incorretos."
                    );
                }

                localStorage.setItem(
                    "rno_access_token",
                    dados.access_token
                );

                localStorage.setItem(
                    "rno_refresh_token",
                    dados.refresh_token
                );

                localStorage.setItem(
                    "rno_user_id",
                    dados.user.id
                );

                mensagem.textContent =
                    "Login realizado com sucesso!";

                mensagem.style.color = "green";

                setTimeout(function() {
                    window.location.href = "dashboard-candidato.html";
                }, 1000);

            } catch (erro) {

                mensagem.textContent =
                    "Erro: " + erro.message;

                mensagem.style.color = "red";

                botao.disabled = false;
            }

        });

    </script>

</body>
</html>
