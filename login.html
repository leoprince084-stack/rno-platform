<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - RNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            min-height: 100vh;
            color: #1f2937;
        }

        .topo {
            background: #0b5ed7;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .nome-plataforma {
            margin-top: 4px;
            font-size: 14px;
            opacity: 0.9;
        }

        .area-principal {
            min-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #0b5ed7;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin: 0 0 30px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0b5ed7;
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.10);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #084298;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            text-align: center;
            font-weight: 600;
            line-height: 1.5;
        }

        .cadastro {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            line-height: 1.6;
        }

        .cadastro a {
            color: #0b5ed7;
            font-weight: 700;
            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar:hover {
            color: #0b5ed7;
        }

        .seguranca {
            margin-top: 22px;
            padding: 13px;
            background: #f8fafc;
            border-radius: 9px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .rodape {
            text-align: center;
            padding: 18px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .area-principal {
                padding: 20px 12px;
            }

            .login-box {
                padding: 25px 18px;
                border-radius: 14px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header class="topo">

    <div class="logo">
        RNO
    </div>

    <div class="nome-plataforma">
        Rede Nacional de Oportunidades
    </div>

</header>


<main class="area-principal">

    <div class="login-box">

        <h1>Entrar na RNO</h1>

        <p class="subtitulo">
            Aceda à sua conta para continuar.
        </p>


        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Digite o seu email"
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                    placeholder="Digite a sua senha"
                >

            </div>


            <button
                type="submit"
                id="botao"
            >
                ENTRAR
            </button>

        </form>


        <div id="mensagem"></div>


        <div class="seguranca">
            🔒 A sua sessão é protegida pela autenticação da RNO.
        </div>


        <div class="cadastro">

            Ainda não tem uma conta?

            <br>

            <a href="candidato.html">
                Criar conta de candidato
            </a>

            <br>

            <a href="cadastro-empresa.html">
                Criar conta de empresa
            </a>

        </div>


        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para a página inicial
        </a>

    </div>

</main>


<footer class="rodape">

    © 2026 RNO — Rede Nacional de Oportunidades

</footer>


<script>

const SUPABASE_URL =
    "https://bwkpmirlwrsbeiavzapm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m5Z5nOdirdaXyoaOoA-fxg_Y_zlNuXJ";

const formulario =
    document.getElementById("formLogin");

const mensagem =
    document.getElementById("mensagem");

const botao =
    document.getElementById("botao");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const senha =
            document.getElementById("senha").value;


        mensagem.textContent =
            "A entrar...";

        mensagem.style.color =
            "#0b5ed7";

        mensagem.style.background =
            "#eef5ff";

        botao.disabled =
            true;


        try {

            const resposta =
                await fetch(
                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY
                        },

                        body: JSON.stringify({
                            email: email,
                            password: senha
                        })
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    dados.error_description ||
                    dados.msg ||
                    "Email ou senha incorretos."
                );

            }


            localStorage.setItem(
                "rno_access_token",
                dados.access_token
            );


            localStorage.setItem(
                "rno_refresh_token",
                dados.refresh_token
            );


            localStorage.setItem(
                "rno_user_id",
                dados.user.id
            );


            mensagem.textContent =
                "Login realizado com sucesso!";

            mensagem.style.color =
                "green";

            mensagem.style.background =
                "#ecfdf5";


            setTimeout(
                function() {

                    window.location.href =
                        "dashboard-candidato.html";

                },
                1000
            );


        } catch (erro) {

            mensagem.textContent =
                "Erro: " + erro.message;

            mensagem.style.color =
                "#dc2626";

            mensagem.style.background =
                "#fef2f2";

            botao.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
